# What CodeQL looks at, and the one thing it must not.
#
# `tests/` is excluded because its fixtures do on purpose what the
# security-extended suite flags: they build malformed and forged frames, feed
# them to the parser, and create store files with loose permissions to prove the
# package refuses or repairs them. Standing alerts for the tests that reproduce a
# bug teach everyone to scroll past alerts.
#
# Production code stays in scope in full, including `tools/` and `scripts/`.
name: "telethon-secret-chat CodeQL"

paths-ignore:
  - tests
