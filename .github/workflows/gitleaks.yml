name: Gitleaks

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 5'

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  gitleaks:
    name: Gitleaks secret scan
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Fail before checkout: Actions debug tracing can disclose scanned contents.
      - name: Reject unsafe diagnostic tracing
        if: runner.debug == '1'
        run: exit 1
      - name: Check out the complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: Build only the audited scanner helper outside the checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          scan_source="$RUNNER_TEMP/kiaro-scanner-source"
          mkdir -p "$scan_source/src"
          cp "$GITHUB_WORKSPACE/tools/secret-scan/Cargo.toml" "$scan_source/Cargo.toml"
          cp "$GITHUB_WORKSPACE/tools/secret-scan/Cargo.lock" "$scan_source/Cargo.lock"
          cp "$GITHUB_WORKSPACE/tools/secret-scan/src/"*.rs "$scan_source/src/"
          cargo fmt --manifest-path "$scan_source/Cargo.toml" --check
          cargo clippy --locked --manifest-path "$scan_source/Cargo.toml" --target-dir "$RUNNER_TEMP/kiaro-scanner-target" -j 1 -- -D warnings
          cargo build --locked --manifest-path "$scan_source/Cargo.toml" --target-dir "$RUNNER_TEMP/kiaro-scanner-target" -j 1
      - name: Scan with verified Gitleaks and observe the actual Git child
        working-directory: ${{ runner.temp }}
        shell: bash
        run: '"$RUNNER_TEMP/kiaro-scanner-target/debug/kiaro-secret-scan"'
