# Rust CodeQL uses rust-analyzer extraction, including build scripts and macros.
# The separate Rust matrix always builds and executes the locked source graph.
name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Receive upstream query updates without waiting for a source change.
    - cron: "27 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyse Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The findings go to the repository's security tab, which needs write.
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: '1.100.0'

      - name: Initialise CodeQL
        uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          languages: rust
          build-mode: none
          # Scopes the analysis; see the file for why `tests/` is out.
          config-file: ./.github/codeql/codeql-config.yml
          # Official codeql/rust-queries security-extended suite.
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@38112626f97ac1fd7acf3df7ebca51f4677c1b38 # v4
        with:
          category: "/language:rust"
