# Static security analysis of the package source.
#
# CodeQL is the only scanner that reads the code here: this repository has no
# secret-scanning or dependency-review workflow (Dependabot watches the
# dependencies). For a library that parses attacker-supplied ciphertext, derives
# keys and writes a chat store to disk, the questions worth asking are taint from
# a decrypted frame to a sink and a path built from caller-supplied text.
#
# Why `build-mode: none`: Python needs no build, and an `autobuild` step on a
# project whose dependencies come from a lockfile only invites the analysis to
# resolve something. The extraction is over the source as committed.
name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # A dependency-free scanner still gets new queries. Weekly, off-peak, so a
    # rule added upstream reaches this repository without waiting for a push.
    - cron: "27 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyse Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The findings go to the repository's security tab, which needs write.
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
          # Scopes the analysis; see the file for why `tests/` is out.
          config-file: ./.github/codeql/codeql-config.yml
          # security-extended over the default: the default suite leaves out most
          # of the path-injection and weak-crypto queries, which are the ones a
          # key-handling library with an on-disk store most needs.
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
