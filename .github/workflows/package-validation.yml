name: Rust Source Package Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  source:
    name: Source and Git distribution inputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: '1.100.0'
      # The four installed-Git-consumer cases run on all nine Rust matrix legs.
      # This job verifies source inputs and never claims a normalized .crate is usable.
      - name: Verify native package inputs and inherited licenses
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps > "$RUNNER_TEMP/native-package-metadata.json"
          cargo package --list --allow-dirty > "$RUNNER_TEMP/native-package-files.txt"
          for path in LICENSE NOTICE Cargo.lock; do
            grep -Fx -- "$path" "$RUNNER_TEMP/native-package-files.txt"
          done
          git ls-files > "$RUNNER_TEMP/native-source-files.txt"
          for path in vendor/grammers/grammers-client/Cargo.toml vendor/grammers/grammers-mtsender/Cargo.toml vendor/grammers/grammers-session/Cargo.toml tools/secret-scan/Cargo.lock; do
            git ls-files --error-unmatch "$path"
          done
          if grep -E '(^|/)\.ai/|\.(py|pyc|ps1|session|db)$' "$RUNNER_TEMP/native-source-files.txt"; then
            exit 1
          fi
      - name: Archive the committed source with its checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rust-source"
          git archive --format=tar "--output=$RUNNER_TEMP/rust-source/kiaro-secret-chat-source.tar" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/rust-source/commit.txt"
          cp "$RUNNER_TEMP/native-source-files.txt" "$RUNNER_TEMP/rust-source/source-files.txt"
          cd "$RUNNER_TEMP/rust-source"
          sha256sum kiaro-secret-chat-source.tar commit.txt source-files.txt > SHA256SUMS
      - name: Upload only committed source inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: source-distribution-rust
          path: ${{ runner.temp }}/rust-source/
          if-no-files-found: error
          retention-days: 7
