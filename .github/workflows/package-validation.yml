name: Package Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same pin as tests.yml and python-lint-format.yml.
  UV_VERSION: "0.12.19"

jobs:
  wheel:
    name: Installed Wheel and Offline Inputs (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Build and install outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install dist/*.whl
          cp tests/wheel_export_smoke.py "$RUNNER_TEMP/wheel-export-smoke.py"
          cp tests/fixtures/tdexport-source.json "$RUNNER_TEMP/tdexport-source.json"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -c "from telethon_secret_chat import SecretChatManager, FileStorage; from telethon_secret_chat.schema import secret_tl; print('installed-wheel imports succeeded')"
          "$RUNNER_TEMP/wheel-smoke/bin/python" "$RUNNER_TEMP/wheel-export-smoke.py" "$RUNNER_TEMP/tdexport-source.json"
      - name: Require the licence files in the wheel
        shell: bash
        run: |
          set -euo pipefail
          listing="$(python -m zipfile -l dist/*.whl)"
          echo "$listing"
          grep -q 'dist-info/licenses/LICENSE' <<<"$listing"
          grep -q 'dist-info/licenses/NOTICE' <<<"$listing"
      # Explicit audit branches opt in; ordinary pushes do not build the bundle.
      - name: Collect reproducible offline test inputs
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'audit/')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/offline-inputs/wheels"
          git archive --format=tar HEAD > "$RUNNER_TEMP/offline-inputs/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/offline-inputs/commit.txt"
          uv export --locked --all-groups --all-extras --no-emit-project --no-hashes --format requirements-txt > "$RUNNER_TEMP/offline-inputs/requirements.txt"
          python -m pip wheel -r "$RUNNER_TEMP/offline-inputs/requirements.txt" --wheel-dir "$RUNNER_TEMP/offline-inputs/wheels"
          cp dist/*.whl "$RUNNER_TEMP/offline-inputs/wheels/"
          cd "$RUNNER_TEMP/offline-inputs"
          sha256sum source.tar requirements.txt wheels/* > SHA256SUMS
      - name: Upload tracked source and dependencies, never local sessions
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'audit/')
        uses: actions/upload-artifact@v7
        with:
          name: offline-test-inputs-py${{ matrix.python }}
          path: ${{ runner.temp }}/offline-inputs/
          if-no-files-found: error
          retention-days: 7
