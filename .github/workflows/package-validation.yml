name: Package Validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  validate-source:
    name: Validate tracked Rust source package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: '1.100.0'
      - name: Validate source archive, downstream Git consumer, and installed tools
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/validate-source.sh --output "$RUNNER_TEMP/rust-source"
      - name: Upload source distribution evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: source-distribution-rust
          path: ${{ runner.temp }}/rust-source/
          if-no-files-found: error
          retention-days: 7
