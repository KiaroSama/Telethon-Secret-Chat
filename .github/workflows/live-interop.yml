name: Live Interoperability (Opt-In)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Interoperability tier to execute"
        required: true
        default: "offline-vectors"
        type: choice
        options:
          - offline-vectors
          - same-library-pair
          - official-client-interop

permissions:
  contents: read

concurrency:
  group: live-interop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  interop:
    name: "Interop (${{ inputs.mode }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: "1.100.0"

      - name: Run offline vectors (always available without credentials)
        if: inputs.mode == 'offline-vectors'
        shell: bash
        run: |
          cargo test --locked --test protocol_vectors --test transport_establishment --test parity_rekey_restart_audit

      - name: Run the selected live harness
        if: inputs.mode != 'offline-vectors'
        shell: bash
        env:
          INTEROP_MODE: ${{ inputs.mode }}
          TELEGRAM_INTEROP_API_ID: ${{ secrets.TELEGRAM_INTEROP_API_ID }}
          TELEGRAM_INTEROP_API_HASH: ${{ secrets.TELEGRAM_INTEROP_API_HASH }}
          TELEGRAM_INTEROP_SESSION_A: ${{ secrets.TELEGRAM_INTEROP_SESSION_A }}
          TELEGRAM_INTEROP_SESSION_B: ${{ secrets.TELEGRAM_INTEROP_SESSION_B }}
          TELEGRAM_INTEROP_PEER_USER_ID: ${{ secrets.TELEGRAM_INTEROP_PEER_USER_ID }}
        run: |
          case "$INTEROP_MODE" in
            same-library-pair) test=same_library_pair ;;
            official-client-interop) test=official_client_interop ;;
            *) exit 2 ;;
          esac
          listing=$(cargo test --locked --test live_interop_harness -- --ignored --list "$test" --exact)
          printf '%s\n' "$listing" | grep -Fx "$test: test" > /dev/null
          cargo test --locked --test live_interop_harness -- --ignored --nocapture "$test" --exact
