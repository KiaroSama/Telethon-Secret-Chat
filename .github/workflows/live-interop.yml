name: Live Interoperability (Opt-In)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Interoperability tier to execute"
        required: true
        default: "offline-vectors"
        type: choice
        options:
          - offline-vectors
          - same-library-pair
          - official-client-interop

permissions:
  contents: read

concurrency:
  group: live-interop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  interop:
    name: "Interop (${{ inputs.mode }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: "1.100.0"

      - name: Run offline vectors (always available without credentials)
        if: inputs.mode == 'offline-vectors'
        shell: bash
        run: |
          cargo test --locked --test protocol_vectors --test transport_establishment --test parity_rekey_restart_audit

      - name: Check controlled credentials for live tiers
        if: inputs.mode != 'offline-vectors'
        shell: bash
        env:
          HAS_API_ID: ${{ secrets.TELEGRAM_INTEROP_API_ID != '' }}
          HAS_API_HASH: ${{ secrets.TELEGRAM_INTEROP_API_HASH != '' }}
          HAS_ACCOUNT_A: ${{ secrets.TELEGRAM_INTEROP_SESSION_A != '' }}
          HAS_ACCOUNT_B: ${{ secrets.TELEGRAM_INTEROP_SESSION_B != '' }}
        run: |
          if [ "$HAS_API_ID" != "true" ] || [ "$HAS_API_HASH" != "true" ] || [ "$HAS_ACCOUNT_A" != "true" ]; then
            echo "::error::Controlled interoperability secrets are not configured in GitHub Actions Secrets. Refusing to fabricate a passing live run."
            exit 1
          fi
          if [ "${{ inputs.mode }}" = "same-library-pair" ] && [ "$HAS_ACCOUNT_B" != "true" ]; then
            echo "::error::same-library-pair mode requires both TELEGRAM_INTEROP_SESSION_A and TELEGRAM_INTEROP_SESSION_B."
            exit 1
          fi
          echo "Controlled secrets detected (values redacted); executing non-destructive harness validation."
          cargo test --locked --test transport_establishment --test parity_transport_audit
