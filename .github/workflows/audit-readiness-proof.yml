name: Readiness Regression Proof

on:
  push:
    branches: [fix/v060-ingress-readiness]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readiness-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: Reproduce deferred-input readiness regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: '1.100.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: '1.100.0'
      - name: Run the bounded readiness reproduction
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/log.sh
          log INFO 'Running the isolated readiness regressions against the checked-out production implementation'
          cargo test --locked --lib ingress::strong_tests::recheck_v060 -- --nocapture --test-threads=2
