name: Python Lint & Format Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same pin as tests.yml and package-validation.yml; see tests.yml for why it
  # is a string per workflow and not `[tool.uv] required-version`.
  UV_VERSION: "0.12.19"

jobs:
  lint-and-format:
    name: Check Linting & Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # black, flake8 and mypy versions come from uv.lock, the same source every
      # other job uses.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # No --select, --exit-zero, --max-complexity or --max-line-length: every one of
      # them overrode .flake8, and the last two contradicted pyproject's black config
      # by checking a 99-column codebase at 88 columns and then discarding the result.
      # `python -m`, the form the README documents: the console-script trampoline
      # fails in a checkout whose path contains a space.
      - name: Lint with Flake8
        run: uv run --locked python -m flake8 . --count --show-source --statistics

      - name: Check formatting with Black
        run: uv run --locked python -m black --check .

      # Lenient on purpose; the configuration and its reasons are in pyproject.toml.
      - name: Type check with mypy
        run: uv run --locked python -m mypy
