name: Tests & Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# A push that supersedes an in-flight run cancels it. Crypto suites are not
# free, and a queue of stale runs is a queue nobody reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a uv release cannot change what CI resolved without a commit
  # saying so. The resolver is a dependency of every result below.
  UV_VERSION: "0.12.8"

jobs:
  lock:
    name: Lockfile Matches The Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # `--locked` fails rather than silently re-resolving. Without it a drifted
      # lock is repaired in place and CI tests a dependency set that no commit
      # ever recorded.
      - name: Refuse a lock that no longer matches pyproject
        run: uv lock --locked

      # Belt and braces: prove the step above changed nothing on disk.
      - name: Prove no step rewrote the lock
        run: git diff --exit-code -- uv.lock

  test:
    name: Pytest With Coverage (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One red interpreter must not hide the others: a KDF that works on 3.11
      # and not on 3.14 is exactly the failure this matrix exists to surface.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Without this uv picks its own interpreter and the leg tests a version it
      # is not named after - green on a matrix that never ran what it claims.
      - name: Point uv at the interpreter this leg installed
        run: echo "UV_PYTHON=${{ env.pythonLocation }}/bin/python" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Prove this leg is running the interpreter it is named after
        run: |
          uv run --locked python -c "import sys; v='%d.%d' % sys.version_info[:2]; \
            assert v == '${{ matrix.python-version }}', f'leg says ${{ matrix.python-version }}, runs {v}'; \
            print('interpreter', v)"

      - name: Run tests with coverage
        run: |
          uv run --locked pytest -q \
            --cov --cov-report=term-missing --cov-report=xml \
            --junitxml=cases-${{ matrix.python-version }}.xml

      # The count each leg COLLECTED, recorded as an artifact. A suite that
      # silently stops being collected on one interpreter is invisible in a green
      # matrix; the gate below is what makes the legs answer for each other.
      - name: Record what this leg actually ran
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET, pathlib
          p = pathlib.Path("cases-${{ matrix.python-version }}.xml")
          if not p.exists():
              print("no junit xml - the run did not reach collection"); raise SystemExit
          r = ET.parse(p).getroot()
          s = r if r.tag == "testsuite" else r.find("testsuite")
          print(f"py${{ matrix.python-version }}: collected {s.get('tests')} case(s)")
          PY

      - name: Upload this leg's case record
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cases-py${{ matrix.python-version }}
          path: cases-${{ matrix.python-version }}.xml
          if-no-files-found: warn

  agree:
    name: Every Leg Collected The Same Cases
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cases-py*
          path: records

      # Cross-leg agreement catches a suite LOST on one interpreter, because the
      # legs then disagree. It cannot catch a suite deleted everywhere at once -
      # that is what a tracked suite count is for, added when there are suites to
      # count.
      - name: Refuse a matrix whose legs disagree
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET, pathlib, sys
          counts = {}
          for p in sorted(pathlib.Path("records").rglob("*.xml")):
              r = ET.parse(p).getroot()
              s = r if r.tag == "testsuite" else r.find("testsuite")
              counts[p.parent.name] = int(s.get("tests"))
          print("collected per leg:", counts)
          if not counts:
              sys.exit("no case records were uploaded - no leg reached collection")
          if len(set(counts.values())) != 1:
              sys.exit(f"legs disagree on how many cases exist: {counts}")
          print(f"all {len(counts)} leg(s) agree: {next(iter(counts.values()))} case(s)")
          PY
