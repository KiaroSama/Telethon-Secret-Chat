name: Tests & Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # One pin per workflow; the same string is in python-lint-format.yml and
  # package-validation.yml. Not `[tool.uv] required-version`: uv refuses to run
  # at all below that version, which would break every local checkout until its
  # uv is upgraded. Dependabot bumps setup-uv but never this string.
  UV_VERSION: "0.12.19"

jobs:
  lock:
    name: Lockfile and Generated Schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv lock --locked
      - run: uv run --locked python tools/generate_schema.py --check

  test:
    name: Pytest (${{ matrix.os }}, ${{ matrix.python }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        backend: [default]
        include:
          - os: windows-latest
            python: "3.13"
            backend: default
          - os: ubuntu-latest
            python: "3.13"
            backend: cryptg
    env:
      TSC_TEST_AES_BACKEND: ${{ matrix.backend }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Bind uv to the installed interpreter
        run: |
          $python = (Get-Command python).Source
          "UV_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify the selected interpreter
        run: uv run --locked python -c "import sys; assert '.'.join(map(str, sys.version_info[:2])) == '${{ matrix.python }}'"
      - name: Execute tests, not only collection
        run: uv run --locked ${{ matrix.backend == 'cryptg' && '--extra fast' || '' }} ${{ runner.os == 'Windows' && '--extra thumbs' || '' }} python -m pytest -q --cov --cov-fail-under=90 --cov-report=term-missing --cov-report=xml --junitxml=junit.xml
      - name: Upload exact case evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cases-${{ matrix.os }}-py${{ matrix.python }}${{ matrix.backend == 'cryptg' && '-cryptg' || '' }}
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: error
      - name: Test the Windows launcher with synthetic credentials and no network
        if: runner.os == 'Windows'
        run: ./tests/powershell/test_interop_launcher.ps1
      - name: Exercise Python module invocation from a path with spaces
        if: runner.os == 'Windows'
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'Secret Chat Space Path'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          # Everything `uv run --locked` needs to build the project where it lands:
          # the lock, the interpreter pin, and the readme and licence files the
          # metadata names.
          Copy-Item -Path telethon_secret_chat, tests, pyproject.toml, uv.lock, .python-version, README.md, LICENSE, NOTICE -Destination $target -Recurse
          Push-Location $target
          try { uv run --locked python -m pytest tests/unit/test_telethon_canary.py -q } finally { Pop-Location }
          exit $LASTEXITCODE

  agree:
    name: Complete Matrix Evidence
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: cases-*
          path: records
      - name: Require every test job, including launcher and space-path checks
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
      # The leg names come from the artifacts the matrix uploaded; the count is
      # what stops a leg that uploaded nothing from passing unnoticed. Six = the
      # four default ubuntu Pythons, Windows, and the explicit native-AES leg.
      - name: Require every leg, identical cases, and only declared skips
        run: python tools/check_test_matrix.py records --expect-legs 6 $(ls records)
