name: Tests & Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.8"

jobs:
  lock:
    name: Lockfile and Generated Schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv lock --locked
      - run: uv run --locked python tools/generate_schema.py
      - run: git diff --exit-code -- uv.lock telethon_secret_chat/schema/secret_tl.py

  test:
    name: Pytest (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.13"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Bind uv to the installed interpreter
        run: |
          $python = (Get-Command python).Source
          "UV_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify the selected interpreter
        run: uv run --locked python -c "import sys; assert '.'.join(map(str, sys.version_info[:2])) == '${{ matrix.python }}'"
      - name: Execute tests, not only collection
        run: uv run --locked python -m pytest -q --cov --cov-fail-under=90 --cov-report=term-missing --cov-report=xml --junitxml=junit.xml
      - name: Upload exact case evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cases-${{ matrix.os }}-py${{ matrix.python }}
          path: junit.xml
          if-no-files-found: error
      - name: Test the Windows launcher with synthetic credentials and no network
        if: runner.os == 'Windows'
        run: ./tests/powershell/test_interop_launcher.ps1
      - name: Exercise Python module invocation from a path with spaces
        if: runner.os == 'Windows'
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'Secret Chat Space Path'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item -Path telethon_secret_chat, tests -Destination $target -Recurse
          $python = Join-Path $PWD '.venv/Scripts/python.exe'
          Push-Location $target
          try { & $python -m pytest tests/unit/test_telethon_canary.py -q } finally { Pop-Location }
          exit $LASTEXITCODE

  agree:
    name: Complete Matrix Evidence
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: cases-*
          path: records
      - name: Require every leg, identical cases, and only explicit live skips
        run: >-
          python tools/check_test_matrix.py records
          cases-ubuntu-latest-py3.11 cases-ubuntu-latest-py3.12
          cases-ubuntu-latest-py3.13 cases-ubuntu-latest-py3.14
          cases-windows-latest-py3.13
