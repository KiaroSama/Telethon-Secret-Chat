version: 2

updates:
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/tools/secret-scan"
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
