# This file is only HALF of Dependabot. The other half is repository state:
# Settings -> Code security -> Dependabot -> enable version updates. There is
# no REST endpoint for that toggle, so it cannot be asserted in CI. A new
# repository starts with it OFF, so if Dependabot stays quiet for weeks after
# the first push, check the toggle before debugging this file.
#
# Carried over from the reference project, where the same mistake cost weeks
# of silence with every action three majors behind.
version: 2

updates:
  # `uv`, and the reason it is not `pip` is worth writing down. The
  # supported-ecosystems table still lists only `pip` for Python, so this was
  # `pip` for a while on the theory that an unrecognised package-ecosystem could
  # invalidate the whole file. It is recognised: the uv updater is real, in
  # general availability since March 2025, and it is what keeps uv.lock in step
  # with pyproject.toml. `pip` would have left the lock this project actually
  # installs from drifting behind the manifest.
  #
  # Known limitation, worth remembering when an alert stays open: the uv updater
  # resolves through pyproject.toml, not through uv.lock, so a CVE in a
  # TRANSITIVE-only package fails with "No files have changed!" and no automated
  # fix. The manual move is `uv lock --upgrade-package <name>`; to give Dependabot
  # something it can update next time, pin a floor under
  # [tool.uv] constraint-dependencies.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      # Grouped so a quiet week is one pull request rather than nine. Majors stay
      # out of every group on purpose: they are the ones that need release notes
      # read and a migration considered, which cannot be done in bulk.
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  # Four workflows run on every push, with credentials and repository write scope
  # between them. An action is a dependency like any other.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]

  # No `docker` ecosystem: this project ships a library, not an image. Add one
  # here the day a Dockerfile appears - Dependabot silently watches nothing for
  # an ecosystem that is not listed.
