[project]
# Not `telethon-secret-chat`: that name on PyPI is an unrelated package, so every
# resolver that consulted the index reported this one as outdated. The import name
# stays `telethon_secret_chat`.
name = "kiaro-telethon-secret-chat"
version = "0.2.0"
description = "Telegram MTProto 2.0 end-to-end encryption (secret chats) for Telethon"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "KiaroSama" }]
keywords = ["telegram", "telethon", "mtproto", "secret-chat", "end-to-end-encryption"]
classifiers = [
    # Alpha, and meant literally: the protocol code inherits from a package that
    # shipped no tests, and the constitution treats every inherited line as
    # unverified until a red test has covered it.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    # No "License ::" classifier: PEP 639 superseded them by the SPDX expression
    # in `license` above, and setuptools now REFUSES a project carrying both
    # ("License classifiers have been superseded by license expressions").
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    # 1.45 is the floor, not a preference: it announces TL layer 229, and the
    # encryption requests this package drives (messages.requestEncryption,
    # acceptEncryption, sendEncrypted*, getDhConfig) must match the schema the
    # transport announces. <2 because the v2 line is a different API, and this
    # package calls one private v1 method (TelegramClient._parse_message_text,
    # guarded by tests/unit/test_telethon_canary.py).
    "telethon>=1.45.0,<2",
]

[project.optional-dependencies]
# Native AES for file encryption. Without it Telethon's AES falls back to pure
# Python, which is correct but slow on large media. 0.6.0 ships wheels for
# CPython 3.11-3.14 on Linux, macOS and Windows, so no marker is needed.
fast = ["cryptg>=0.6.0"]

[project.urls]
Homepage = "https://github.com/KiaroSama/Telethon-Secret-Chat"
Repository = "https://github.com/KiaroSama/Telethon-Secret-Chat"
Changelog = "https://github.com/KiaroSama/Telethon-Secret-Chat/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/KiaroSama/Telethon-Secret-Chat/issues"

[dependency-groups]
# Floors at the majors actually tested (uv.lock), so an unlocked install cannot
# pick a formatter that disagrees with `generate_schema.py --check`.
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7",
    "pytest-timeout>=2.4",
    "black>=26",
    "flake8>=7.4",
    "mypy>=2.3",
    "hypothesis>=6.168",
]

[build-system]
# Capped because build requirements are not locked: every CI build and every
# git-commit install resolves the newest setuptools, and a new major has refused
# previously valid metadata before (the licence classifier, above). Raise the cap
# deliberately, with a green `Package Validation` run as the evidence.
requires = ["setuptools>=84,<86"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["telethon_secret_chat*"]

[tool.setuptools.package-data]
# PEP 561 marker: tells a consumer's type checker to read the inline annotations.
# schema/end-to-end.tl is not shipped; only tools/generate_schema.py reads it.
telethon_secret_chat = ["py.typed"]

[tool.black]
# 99, matching the reference project this was scaffolded from, so a file moved
# between the two is not reformatted on arrival.
line-length = 99
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Bounded by default. A crypto handshake that never completes is the shape of
# failure this package can produce, and an unbounded test hides it as a hang.
timeout = 120
# The unawaited coroutine of 2026-09-20 shipped because a warning is not a failure.
addopts = "--strict-markers --strict-config"
filterwarnings = [
    "error::RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
# The whole package: a new module is measured the moment it exists, including
# one no test imports (it then reports 0%).
source = ["telethon_secret_chat"]
# schema/secret_tl.py is deliberately left out by `omit` below. It is generated (see
# tools/generate_schema.py), and ninety constructors' worth of emitted branches
# would report a percentage for the generator's output rather than for anything a
# human wrote. What covers it is tests/unit/test_schema_roundtrip.py, which checks
# it against the published schema it was generated from.
omit = ["telethon_secret_chat/schema/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
# Lenient on purpose: the package is partly annotated, and this check exists to
# catch record-shape and None-flow mistakes, not to demand annotations. Tighten
# module by module (disallow_untyped_defs), never in one sweep.
python_version = "3.11"
packages = ["telethon_secret_chat"]
# Generated; its untyped constructors say nothing about hand-written code.
exclude = ["telethon_secret_chat/schema/"]
# Telethon ships no type information.
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# `exclude` stops discovery only; imports of the schema would still be followed.
module = "telethon_secret_chat.schema.*"
follow_imports = "skip"
