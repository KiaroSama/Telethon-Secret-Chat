[package]
name = "grammers-session"
version = "0.12.0"
authors = ["Lonami Exo <totufals@hotmail.com>"]
license = "MIT OR Apache-2.0"
description = """
Different session storages for Telegram data.
"""
homepage = "https://codeberg.org/Lonami/grammers"
documentation = "https://docs.rs/grammers-session"
repository = "https://codeberg.org/Lonami/grammers"
keywords = ["telegram", "tl"]
categories = []
edition = "2024"

[features]
default = ["sqlite-storage"]
sqlite-storage = ["dep:libsql", "dep:tokio"]
serde = ["dep:serde", "dep:serde_with"]

[dependencies]
grammers-tl-types = { git = "https://codeberg.org/Lonami/grammers.git", rev = "02367f9711ca3589a8bbb02e4128aca1631c77c4", version = "0.12.0", features=["deserializable-functions"] }

libsql = { version = "0.10.0", default-features = false, features = ["core"], optional = true }
tokio = { version = "1.54.1", default-features = false, features = ["sync"], optional = true }
tracing = "0.1.44"

serde = { version = "1", features = ["derive"], optional = true }
serde_with = { version = "3", features = ["hex"], optional = true }

[dev-dependencies]
toml = "1.2.1"
tokio = { version = "1.54.1", default-features = false, features = ["sync", "rt"] }
